name: PR checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  contribution-checks:
    name: Contribution checks
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check out merge result without submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Install small YAML parser
        run: python3 -m pip install --disable-pip-version-check --retries 0 --timeout 15 PyYAML==6.0.2
      - name: Validate title, changed files and contribution metadata
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        # HEAD is GitHub's test merge commit; its first parent is the base tip.
        # Pass untrusted title text as data, never interpolate it into shell code.
        run: python3 .github/scripts/check_contributions.py --base HEAD^ --title "$PR_TITLE"
