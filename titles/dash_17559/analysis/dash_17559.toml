# "Validation failed: 28 unresolved calls", 28 x "b <target> - target not in any
# function" for the 23 targets below. None of them has a .pdata entry (checked
# against the 28 350 .pdata starts; known starts such as the entry point are found).
#
# Evidence per entry comes from `x360n-content disasm` (the SDK's binutils
# decoder, Xenon dialect) on the loaded image. Each entry is the start only:
# no size and no name, boundaries are left to discovery. The "bounds" line is
# what the disassembly shows and is checked against the generated function
# after codegen (docs/dashboard.md).
#
# Not added here: other code without .pdata that nothing failed on (e.g. the
# adjustor thunk at 0x9237E660). Entries here are added only for observed failures.
# Function starts reached only through data pointers (vtables without RTTI) are in
# dash_17559_pointer_targets.toml, classified by scripts/analysis/check-pointer-targets.ps1.

# The Lua protected call at 0x928E4028 saves a jump buffer via 0x9291C760;
# 0x928E4A00 throws via 0x9291C330. These are the matching CRT routines
# (save/restore f14-f31, r13-r31, v64-v127, SP+144, CR+304, LR+308).
# A normal generated C++ return cannot implement the nonlocal guest return.
