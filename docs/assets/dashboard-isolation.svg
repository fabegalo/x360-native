<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc">
 <title id="title">Dashboard version isolation</title><desc id="desc">Each original dashboard version has its own matching modules and resources. Generic runtime infrastructure may be shared, but original assets do not cross profiles.</desc>
 <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101820"/><stop offset="1" stop-color="#17252a"/></linearGradient><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#edf5f2}.head{font-size:20px;font-weight:700}.label{font-size:17px;font-weight:700}.small{font-size:14px;fill:#b6c8c2}.box{fill:#1c2d32;stroke:#48bd8d;stroke-width:2}.shared{fill:#213438;stroke:#59d9c7;stroke-width:2}</style></defs>
 <rect width="1000" height="340" rx="26" fill="url(#bg)"/><text x="500" y="50" text-anchor="middle" class="head">One dashboard profile · matching originals only</text>
 <rect x="60" y="91" width="255" height="156" rx="18" class="box"/><text x="187" y="128" text-anchor="middle" class="label">Dashboard 17559</text><text x="187" y="166" text-anchor="middle" class="small">17559 vk.xex · XUI · fonts</text><text x="187" y="194" text-anchor="middle" class="small">identified by provenance + SHA-256</text>
 <rect x="372" y="91" width="255" height="156" rx="18" class="box"/><text x="499" y="128" text-anchor="middle" class="label">Dashboard 13604</text><text x="499" y="166" text-anchor="middle" class="small">13604 modules · XUI · fonts</text><text x="499" y="194" text-anchor="middle" class="small">separate profile; no fallback</text>
 <rect x="685" y="91" width="255" height="156" rx="18" class="box"/><text x="812" y="128" text-anchor="middle" class="label">Dashboard 6717</text><text x="812" y="166" text-anchor="middle" class="small">6717 modules · XUI · fonts</text><text x="812" y="194" text-anchor="middle" class="small">separate profile; support pending</text>
 <path d="M187 254v20h625v-20" fill="none" stroke="#59d9c7" stroke-width="2"/><rect x="273" y="272" width="455" height="46" rx="14" class="shared"/><text x="500" y="301" text-anchor="middle" class="small">Shared generic ReXGlue runtime infrastructure</text>
</svg>
