<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">x360-native architecture overview</title>
  <desc id="desc">Local Xbox 360 content is analyzed and translated ahead of time into native host code. A compatibility runtime supplies console services and translates Xenos GPU work to the host graphics API.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101820"/><stop offset="1" stop-color="#17252a"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#38d987"/><stop offset="1" stop-color="#59d9c7"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#5ad7b4"/></marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#edf5f2}.label{font-size:20px;font-weight:700}.small{font-size:15px;fill:#b6c8c2}.tiny{font-size:13px;fill:#99ada7}.box{fill:#1c2d32;stroke:#3d605a;stroke-width:2}.host{fill:#192a2d;stroke:#48bd8d;stroke-width:2}
    </style>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <text x="48" y="56" class="small" letter-spacing="2">BUILD AHEAD OF TIME · EXECUTE NATIVELY · RECREATE REQUIRED CONSOLE SERVICES</text>
  <rect x="48" y="112" width="220" height="220" rx="20" class="box"/>
  <text x="158" y="162" text-anchor="middle" class="label">Local Xbox 360</text><text x="158" y="192" text-anchor="middle" class="label">content</text>
  <path d="M95 238h126M116 265h84M137 292h42" stroke="url(#accent)" stroke-width="7" stroke-linecap="round"/>
  <text x="158" y="320" text-anchor="middle" class="tiny">XEX + matching resources</text>
  <path d="M276 222h65" stroke="#5ad7b4" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="355" y="112" width="235" height="220" rx="20" class="box"/>
  <text x="472" y="162" text-anchor="middle" class="label">Static PowerPC</text><text x="472" y="192" text-anchor="middle" class="label">recompilation</text>
  <text x="472" y="237" text-anchor="middle" class="small">Analyze → generate C++</text><text x="472" y="264" text-anchor="middle" class="small">→ compile before launch</text>
  <text x="472" y="310" text-anchor="middle" class="tiny">No runtime JIT or interpreter</text>
  <path d="M598 222h65" stroke="#5ad7b4" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="677" y="112" width="220" height="220" rx="20" class="box"/>
  <text x="787" y="162" text-anchor="middle" class="label">Native host</text><text x="787" y="192" text-anchor="middle" class="label">program</text>
  <text x="787" y="237" text-anchor="middle" class="small">Prepared code + data</text><text x="787" y="264" text-anchor="middle" class="small">loaded for a known profile</text>
  <text x="787" y="310" text-anchor="middle" class="tiny">Not a promise of compatibility</text>
  <path d="M905 222h65" stroke="#5ad7b4" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="985" y="112" width="167" height="220" rx="20" class="host"/>
  <text x="1068" y="162" text-anchor="middle" class="label">Host OS</text>
  <text x="1068" y="208" text-anchor="middle" class="small">PPC / XAM</text><text x="1068" y="235" text-anchor="middle" class="small">services</text>
  <text x="1068" y="270" text-anchor="middle" class="small">Xenos → D3D12</text>
  <text x="600" y="385" text-anchor="middle" class="tiny">ReXGlue provides the compatibility runtime; the original Microsoft kernel and full XAM are not booted.</text>
</svg>
